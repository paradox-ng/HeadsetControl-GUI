[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "headsetcontrol-gui"
dynamic = ["version"]
description = "Qt6 system-tray GUI for the HeadsetControl CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "Unlicense"
dependencies = ["PySide6>=6.5"]

[project.scripts]
headsetcontrol-gui = "headsetcontrol_gui.__main__:main"

[tool.setuptools]
packages = ["headsetcontrol_gui"]

# Single source of truth: keeps pyproject and the package from drifting,
# as they did when 0.1.1 shipped with __version__ still at 0.1.0.
[tool.setuptools.dynamic]
version = {attr = "headsetcontrol_gui.__version__"}
